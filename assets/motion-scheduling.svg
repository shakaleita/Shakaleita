<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 324" width="1180" height="324" role="img" aria-labelledby="title desc">
<title id="title">ClinicFlow / booking lifecycle</title><desc id="desc">Conflict-aware appointment state changes: Request to Validate to Conflict gate to Schedule.</desc>
